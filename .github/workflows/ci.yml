# CI for the two-stage promotion model:
#
#   feature branch (local work) --PR--> dev        (integration; every PR commit runs this workflow)
#   dev --PR--> main                               (production; tests run again before merge)
#
# GitHub cannot enforce "only PRs" from YAML alone. In the repo, set branch protection:
#
#   dev:
#     - Require a pull request before merging
#     - Require status checks to pass (job: test)
#     - (Recommended) Require branches to be up to date before merging
#
#   main:
#     - Require a pull request before merging
#     - Require status checks to pass (job: test)
#     - (Optional) Restrict who can push, or allow only merges from dev via PR + review
#
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
