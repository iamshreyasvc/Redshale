[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-pipeline-studio"
version = "0.1.0"
description = "macOS-first no-code ML pipeline builder (PySide6 + node graph, PyTorch/TensorFlow)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ML Pipeline Studio" }]
dependencies = [
    "NodeGraphQt>=0.6.44",
    "PySide6>=6.6.0",
    "pydantic>=2.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "tensorflow>=2.14",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
]

[project.scripts]
ml-pipeline-studio = "ml_pipeline_studio.app:main"

[project.urls]
Homepage = "https://github.com/iamshreyasvc/ml-pipeline-studio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
